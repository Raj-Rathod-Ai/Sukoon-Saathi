<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Warm ivory background circle -->
  <circle cx="16" cy="16" r="16" fill="#FAF9F6"/>
  <!-- Sage green flowing S-curve (representing sukoon/balance) -->
  <path d="M11 10 C11 10, 10 14, 16 14 C22 14, 21 18, 21 18" 
        stroke="#6B8F71" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Small calm dot at the top of S -->
  <circle cx="11" cy="10" r="1.5" fill="#6B8F71"/>
  <!-- Small calm dot at the bottom of S -->
  <circle cx="21" cy="22" r="1.5" fill="#8B7355"/>
  <!-- Lower arc continuation -->
  <path d="M21 18 C21 18, 20 22, 21 22" 
        stroke="#6B8F71" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
